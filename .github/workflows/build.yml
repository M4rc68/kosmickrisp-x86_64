name: KosmicKrisp x86_64

# Baut Mesas Vulkan-Treiber KosmicKrisp als x86_64-dylib, damit CrossOver
# (Wine unter Rosetta 2) ihn laden kann. Nur unveraenderter Mesa-Quellcode.

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: "Mesa-Tag ohne Praefix, z. B. 26.2.5"
        required: true
        default: "26.2.5"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      MESA_VER: ${{ github.event.inputs.mesa_version }}
    steps:
      - name: Umgebung anzeigen
        run: |
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version
          uname -m
          /usr/bin/arch -x86_64 /usr/bin/true && echo "Rosetta vorhanden" || echo "Rosetta fehlt"

      - name: Werkzeuge installieren
        run: |
          brew install meson ninja llvm libclc spirv-llvm-translator spirv-tools pkgconf
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install mako packaging pyyaml

      - name: Mesa laden
        run: |
          curl -fsSL -o mesa.tar.gz "https://gitlab.freedesktop.org/mesa/mesa/-/archive/mesa-${MESA_VER}/mesa-mesa-${MESA_VER}.tar.gz"
          tar -xzf mesa.tar.gz
          mv "mesa-mesa-${MESA_VER}" mesa
          shasum -a 256 mesa.tar.gz | tee mesa.sha256

      - name: Stufe 1 - native Hilfscompiler (arm64)
        run: |
          export PATH="$RUNNER_TEMP/venv/bin:$PATH:$(brew --prefix llvm)/bin"
          meson setup build-native mesa --buildtype=release \
            -Dplatforms=macos -Dvulkan-drivers=kosmickrisp -Dgallium-drivers= \
            -Dopengl=false -Dglx=disabled -Degl=disabled -Dgbm=disabled \
            -Dgles1=disabled -Dgles2=disabled -Dzstd=disabled \
            -Dmesa-clc=enabled -Dinstall-mesa-clc=true \
            -Dprecomp-compiler=enabled -Dinstall-precomp-compiler=true
          ninja -C build-native
          mkdir -p "$RUNNER_TEMP/clctools"
          for t in mesa_clc vtn_bindgen2 kk_clc; do
            p=$(find build-native -type f -perm -u+x -name "$t" | head -1)
            test -n "$p" || { echo "FEHLT: $t"; exit 1; }
            cp "$p" "$RUNNER_TEMP/clctools/"
          done
          ls -la "$RUNNER_TEMP/clctools"

      - name: Stufe 2 - KosmicKrisp fuer x86_64
        run: |
          cat > cross-x86_64.ini <<'EOF'
          [binaries]
          c = ['/usr/bin/clang', '-arch', 'x86_64', '-mmacosx-version-min=26.0']
          cpp = ['/usr/bin/clang++', '-arch', 'x86_64', '-mmacosx-version-min=26.0']
          objc = ['/usr/bin/clang', '-arch', 'x86_64', '-mmacosx-version-min=26.0']
          objcpp = ['/usr/bin/clang++', '-arch', 'x86_64', '-mmacosx-version-min=26.0']
          ar = '/usr/bin/ar'
          strip = '/usr/bin/strip'
          pkg-config = '/usr/bin/false'

          [host_machine]
          system = 'darwin'
          kernel = 'xnu'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF
          export PATH="$RUNNER_TEMP/clctools:$RUNNER_TEMP/venv/bin:$PATH"
          export MACOSX_DEPLOYMENT_TARGET=26.0
          meson setup build-x64 mesa --cross-file cross-x86_64.ini --buildtype=release \
            -Dplatforms=macos -Dvulkan-drivers=kosmickrisp -Dgallium-drivers= \
            -Dopengl=false -Dglx=disabled -Degl=disabled -Dgbm=disabled \
            -Dgles1=disabled -Dgles2=disabled -Dzstd=disabled \
            -Dmesa-clc=system -Dprecomp-compiler=system \
            -Dllvm=disabled -Dspirv-tools=disabled -Dxmlconfig=disabled -Dexpat=disabled \
            --prefer-static
          ninja -C build-x64 src/kosmickrisp/vulkan/libvulkan_kosmickrisp.dylib

      - name: Paket schnueren
        run: |
          mkdir -p out
          cp build-x64/src/kosmickrisp/vulkan/libvulkan_kosmickrisp.dylib out/
          lipo -info out/libvulkan_kosmickrisp.dylib
          otool -L out/libvulkan_kosmickrisp.dylib
          nm -gU out/libvulkan_kosmickrisp.dylib | grep vk_icd
          cat > out/kosmickrisp_icd_x86_64.json <<'EOF'
          {
              "file_format_version": "1.0.0",
              "ICD": {
                  "library_path": "./libvulkan_kosmickrisp.dylib",
                  "api_version": "1.4.0"
              }
          }
          EOF
          cp mesa.sha256 out/
          echo "Mesa ${MESA_VER}, gebaut $(date -u +%F) auf $(sw_vers -productVersion), Xcode $(xcodebuild -version | head -1)" > out/BUILDINFO.txt
          shasum -a 256 out/libvulkan_kosmickrisp.dylib >> out/BUILDINFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: kosmickrisp-x86_64
          path: out/

      - name: Logs bei Fehler sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-native/meson-logs/
            build-x64/meson-logs/
